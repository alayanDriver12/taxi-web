<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Reservas · Alayan</title>
<link rel="stylesheet" href="/panel/panel.css">
<style>
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input{max-width:260px}
.filters select{width:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stats .tag{font-size:12px;padding:4px 10px}
.price{display:flex;gap:6px;align-items:center;margin-top:8px}
.price input{max-width:96px}
.paid{margin-top:8px;font-size:13px}
.paid b{font-size:16px}
details{margin-top:8px;font-size:12px;color:var(--muted)}
details li{margin:3px 0}
.mode{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;border:1px solid}
.mode.mock{background:#1f3a5a40;border-color:#4a7bb066}
.mode.off{background:#6b222240;border-color:#b94a4a66}
td.cobro{min-width:250px}
</style></head><body>
<main>
  <div class="head">
    <h1>Reservas</h1>
    <div class="row" style="margin:0">
      <button class="ghost" id="reload">Actualizar</button>
      <a class="btn" href="/api/panel/bookings.csv">Exportar CSV</a>
    </div>
  </div>
  <div id="mode"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Buscar nombre, teléfono, email, ruta…">
    <select id="view">
      <option value="recent">Últimas recibidas</option>
      <option value="upcoming">Próximos viajes</option>
    </select>
    <select id="status">
      <option value="">Todos los estados</option>
      <option>pendiente</option><option>pagada</option><option>confirmada</option><option>cancelada</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="wrap"><table>
    <thead><tr><th>#</th><th>Cliente</th><th>Trayecto</th><th>Fecha</th><th>Detalles</th><th>Estado</th><th>Cobro</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7">Cargando…</td></tr></tbody>
  </table></div>
</main>
<script src="/panel/panel.js"></script>
<script>
const STATUSES = ['pendiente', 'pagada', 'confirmada', 'cancelada'];
const PAY_LABELS = { sin_pago: 'sin presupuesto', enlace_enviado: 'presupuesto enviado', pagado: 'pagado', fallido: 'pago fallido' };
const ATTEMPT_LABELS = { PENDING: 'en curso', PAID: 'pagado', FAILED: 'rechazado', EXPIRED: 'caducado' };
const $ = id => document.getElementById(id);
let me, all = [];
const today = () => new Date().toLocaleDateString('sv'); // AAAA-MM-DD en hora local
const eur = n => Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const utc = s => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) : '';

// Para wa.me hace falta el número con prefijo: si es un móvil español de 9 cifras se añade 34
function waNumber(phone) {
  const d = String(phone || '').replace(/\D/g, '').replace(/^00/, '');
  return /^[67]\d{8}$/.test(d) ? '34' + d : d;
}

function waQuote(r) {
  const text = `Hola ${r.name.split(' ')[0]}, te confirmamos tu transfer ${r.origin} → ${r.destination} el ${r.date} a las ${r.time}. ` +
    `Precio: ${eur(r.amount_eur)} (IVA incluido). Puedes revisar los detalles y pagar de forma segura aquí: ${r.payUrl}`;
  return `https://wa.me/${waNumber(r.phone)}?text=${encodeURIComponent(text)}`;
}

function cobro(r) {
  const attempts = r.payments.length
    ? `<details><summary>${r.payments.length} intento${r.payments.length > 1 ? 's' : ''} de pago</summary><ul>${r.payments.slice().reverse().map(p =>
        `<li>${utc(p.created_at)} · ${eur(p.amount_eur)} · ${ATTEMPT_LABELS[p.status] || p.status}${p.transaction_code ? ' · ref. ' + esc(p.transaction_code) : ''}</li>`).join('')}</ul></details>`
    : '';
  const pending = r.payments.some(p => p.status === 'PENDING');

  if (r.payment_status === 'pagado') {
    const paid = r.payments.find(p => p.status === 'PAID');
    return `<span class="tag pagado">pagado</span>
      <div class="paid"><b>${eur(paid?.amount_eur ?? r.amount_eur)}</b><br><small>${utc(r.paid_at)}${paid?.transaction_code ? ' · ref. ' + esc(paid.transaction_code) : ''}</small></div>${attempts}`;
  }
  const canQuote = r.status !== 'cancelada' && r.date >= today();
  return `<span class="tag ${r.payment_status}">${PAY_LABELS[r.payment_status] || r.payment_status}</span>
    <div class="price"><input id="a${r.id}" type="number" step="0.01" min="0" placeholder="Precio €" value="${r.amount_eur ?? ''}" ${canQuote ? '' : 'disabled'}>
      ${canQuote ? `<button class="small" data-quote="${r.id}">${r.payUrl ? 'Actualizar' : 'Enviar presupuesto'}</button>` : ''}</div>
    ${r.payUrl && canQuote ? `<div class="row">
      <a class="btn small" href="${esc(waQuote(r))}" target="_blank">Enviar por WhatsApp</a>
      <button class="ghost small" data-copy="${esc(r.payUrl)}">Copiar enlace</button></div>` : ''}
    ${pending ? `<div class="row"><button class="ghost small" data-sync="${r.id}">Comprobar pago</button></div>` : ''}
    ${attempts}`;
}

function render() {
  const q = $('q').value.trim().toLowerCase(), st = $('status').value, upcoming = $('view').value === 'upcoming';
  let rows = all.filter(r =>
    (!st || r.status === st) &&
    (!upcoming || r.date >= today()) &&
    (!q || [r.name, r.company, r.phone, r.email, r.origin, r.destination, r.flight, r.notes, '#' + r.id].join(' ').toLowerCase().includes(q)));
  if (upcoming) rows = rows.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  const active = all.filter(r => r.status !== 'cancelada');
  $('stats').innerHTML = [
    `<span class="tag pendiente">${active.filter(r => !r.amount_eur && r.payment_status !== 'pagado').length} sin precio</span>`,
    `<span class="tag enlace_enviado">${active.filter(r => r.payment_status === 'enlace_enviado').length} esperando pago</span>`,
    `<span class="tag pagada">${all.filter(r => r.payment_status === 'pagado').length} pagadas</span>`,
    `<span class="tag">${active.filter(r => r.date === today()).length} hoy</span>`
  ].join('');

  $('rows').innerHTML = rows.map(r => `<tr class="${r.date < today() ? 'past' : ''}">
    <td>${r.id}<br><small>${utc(r.created_at)}</small></td>
    <td><b>${esc(r.name)}</b>${r.company ? '<br>' + esc(r.company) : ''}<br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br><small>${esc(r.email)}</small></td>
    <td>${esc(r.origin)}<br>→ ${esc(r.destination)}</td>
    <td><b>${esc(r.date)}</b><br>${esc(r.time)}</td>
    <td>${r.pax} pax · ${r.luggage} maletas${r.flight ? '<br>✈ ' + esc(r.flight) : ''}${r.sign ? '<br>🪧 ' + esc(r.sign) : ''}</td>
    <td>
      <select data-id="${r.id}" data-field="status">${STATUSES.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <input data-id="${r.id}" data-field="notes" placeholder="Notas internas" value="${esc(r.notes)}" style="margin-top:6px">
      ${me.role === 'admin' ? `<div class="row"><button class="danger small" data-del="${r.id}">Eliminar</button></div>` : ''}
    </td>
    <td class="cobro">${cobro(r)}</td></tr>`).join('') || `<tr><td colspan="7">${all.length ? 'Ninguna reserva coincide con el filtro.' : 'Sin reservas todavía.'}</td></tr>`;
}

function renderMode(mode) {
  $('mode').innerHTML = {
    mock: '<div class="mode mock">🧪 <b>Modo simulación de SumUp:</b> los pagos son de prueba y no se cobra nada. Para cobrar de verdad, configura SUMUP_API_KEY y SUMUP_MERCHANT_CODE.</div>',
    off: '<div class="mode off">⚠️ <b>SumUp sin configurar:</b> puedes enviar presupuestos, pero los clientes no podrán pagar online hasta configurar SUMUP_API_KEY y SUMUP_MERCHANT_CODE.</div>'
  }[mode] || '';
}

async function load() {
  try {
    const d = await api('/api/panel/bookings');
    all = d.bookings;
    renderMode(d.sumupMode);
    render();
  } catch (e) { toast(e.message, 'error'); }
}

async function update(id, body) {
  try { await api('/api/panel/bookings/' + id, { method: 'PATCH', body }); toast('Guardado'); await load(); }
  catch (e) { toast(e.message, 'error'); }
}

$('rows').addEventListener('change', e => {
  const { id, field } = e.target.dataset;
  if (id && field) update(id, { [field]: e.target.value });
});

$('rows').addEventListener('click', async e => {
  const t = e.target, d = t.dataset;
  if (d.quote) {
    const amount = $('a' + d.quote).value;
    if (!(parseFloat(amount) > 0)) return toast('Pon primero el precio.', 'error');
    t.disabled = true;
    try {
      await api('/api/panel/bookings/' + d.quote, { method: 'PATCH', body: { amount } });
      const { url } = await api(`/api/panel/bookings/${d.quote}/quote`, { method: 'POST' });
      await navigator.clipboard?.writeText(url).catch(() => {});
      toast('Presupuesto listo y enlace copiado. Pulsa «Enviar por WhatsApp» para mandárselo.');
      await load();
    } catch (err) { toast(err.message, 'error'); t.disabled = false; }
  }
  if (d.copy) {
    await navigator.clipboard?.writeText(d.copy).then(() => toast('Enlace copiado'), () => toast('No se pudo copiar', 'error'));
  }
  if (d.sync) {
    t.disabled = true;
    try { await api(`/api/panel/bookings/${d.sync}/sync`, { method: 'POST' }); toast('Estado actualizado'); await load(); }
    catch (err) { toast(err.message, 'error'); t.disabled = false; }
  }
  if (d.del) {
    if (!confirm(`¿Eliminar la reserva #${d.del}? No se puede deshacer.`)) return;
    try { await api('/api/panel/bookings/' + d.del, { method: 'DELETE' }); toast('Reserva eliminada'); await load(); }
    catch (err) { toast(err.message, 'error'); }
  }
});

['q', 'status', 'view'].forEach(id => $(id).addEventListener('input', render));
$('reload').onclick = load;

initPanel('reservas').then(u => { me = u; load(); });
</script></body></html>
