<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Acceso · Alayan</title>
<link rel="stylesheet" href="/panel/panel.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(360px,100%)}
.box h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:500;margin:0 0 4px}
.box p{margin:0 0 22px}
.box form>div{margin-bottom:14px}
.box button{width:100%;justify-content:center;padding:11px;font-size:13px;margin-top:6px}
#err{color:#ff9a9a;min-height:20px;margin-top:10px;font-size:13px}
</style></head><body>
<div class="box card">
  <h1>Alayan Driver</h1>
  <p class="muted">Panel interno</p>
  <form id="f">
    <div><label for="u">Usuario</label><input id="u" name="username" autocomplete="username" autofocus required></div>
    <div><label for="p">Contraseña</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Entrar</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<script src="/panel/panel.js"></script>
<script>
const f = document.getElementById('f'), err = document.getElementById('err');
f.onsubmit = async e => {
  e.preventDefault();
  err.textContent = '';
  const btn = f.querySelector('button');
  btn.disabled = true;
  try {
    const d = await api('/api/auth/login', { method: 'POST', body: Object.fromEntries(new FormData(f)) });
    // Solo se vuelve a rutas internas (evita redirecciones a otros dominios)
    const next = new URLSearchParams(location.search).get('next') || '';
    location.href = /^\/(?![\/\\])/.test(next) ? next : d.home;
  } catch (e2) {
    err.textContent = e2.message;
    btn.disabled = false;
  }
};
</script></body></html>
