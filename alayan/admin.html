<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Alayan</title>
<style>
:root{--g:#C5A46A}*{box-sizing:border-box}body{margin:0;background:#0A0A0A;color:#F7F3ED;font:14px Inter,system-ui,sans-serif;padding:20px}
h1{font-size:22px;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
a.btn,button{background:var(--g);color:#000;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:12px}
button.ghost{background:transparent;color:#F7F3ED;border:1px solid #ffffff30}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #ffffff14;text-align:left;vertical-align:top}
th{color:#ffffff80;font-size:11px;letter-spacing:.1em;text-transform:uppercase}input,select{background:#161616;color:#fff;border:1px solid #ffffff25;border-radius:8px;padding:6px;width:100%}
.tag{padding:2px 8px;border-radius:999px;font-size:11px;background:#ffffff18}.pagado,.confirmada,.pagada{background:#1f5a34}.cancelada,.fallido{background:#6b2222}
.row{display:flex;gap:6px;margin-top:6px}small{color:#ffffff80}
</style></head><body>
<header><h1>Reservas Alayan Driver</h1><div><button class="ghost" onclick="load()">Actualizar</button> <a class="btn" href="/api/admin/export.csv">Exportar CSV</a></div></header>
<div class="wrap"><table><thead><tr><th>#</th><th>Cliente</th><th>Trayecto</th><th>Fecha</th><th>Detalles</th><th>Estado</th><th>Cobro</th></tr></thead><tbody id="b"></tbody></table></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){const r=await fetch(u,o&&{...o,headers:{'Content-Type':'application/json'},body:JSON.stringify(o.body)});return r.json()}
async function load(){
 const rows=await api('/api/admin/bookings');
 b.innerHTML=rows.map(r=>`<tr>
 <td>${r.id}<br><small>${esc(r.created_at)}</small></td>
 <td><b>${esc(r.name)}</b><br>${esc(r.company)}<br><a style="color:var(--g)" href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br>${esc(r.email)}</td>
 <td>${esc(r.origin)}<br>→ ${esc(r.destination)}</td>
 <td>${esc(r.date)}<br>${esc(r.time)}</td>
 <td>${r.pax} pax · ${r.luggage} maletas<br>${r.flight?'✈ '+esc(r.flight)+'<br>':''}${r.sign?'🪧 '+esc(r.sign):''}</td>
 <td><select onchange="upd(${r.id},{status:this.value})">${['pendiente','pagada','confirmada','cancelada'].map(s=>`<option ${s==r.status?'selected':''}>${s}</option>`).join('')}</select>
  <input placeholder="Notas" value="${esc(r.notes)}" onchange="upd(${r.id},{notes:this.value})" style="margin-top:6px"></td>
 <td><span class="tag ${r.payment_status}">${r.payment_status}</span>
  <div class="row"><input id="a${r.id}" type="number" step="0.01" placeholder="€" value="${r.amount_eur??''}"><button onclick="link(${r.id})">Enlace SumUp</button></div>
  ${r.checkout_url?`<small><a style="color:var(--g)" href="${esc(r.checkout_url)}" target="_blank">Ver enlace de pago</a></small>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin reservas todavía.</td></tr>';
}
async function upd(id,body){await api('/api/admin/bookings/'+id,{method:'PATCH',body});load()}
async function link(id){const amount=parseFloat(document.getElementById('a'+id).value);const d=await api('/api/admin/bookings/'+id,{method:'PATCH',body:{amount,createLink:true}});
 if(d.error)return alert(d.error);await navigator.clipboard?.writeText(d.checkoutUrl).catch(()=>{});alert('Enlace creado y copiado. Envíaselo al cliente por WhatsApp.');load()}
load();
</script></body></html>
